{% extends "base.html" %}
{% block content %}
<h1>kunder i verkstedet</h1>
<table>
    <caption>Registrere kunder</caption>
    <thead>
        <tr>
            <th scope="col">ID</th>
            <th scope="col">navn</th>
            <th scope="col">E-post</th>
            <th scope="col">Telefon</th>
        </tr>
        <tbody>
            {% for kunde in kunder %}
            <tr>
                <td>{{ kunde.kunde_id }}</td>
                <td>{{ kunde.navn }}</td>
                <td>{{ kunde.epost }}</td>
                <td>{{ kunde.telefon }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </thead>
</table>
{% endblock %}
